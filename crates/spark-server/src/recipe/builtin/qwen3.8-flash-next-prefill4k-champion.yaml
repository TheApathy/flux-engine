# Built-in recipe: deterministic Flash-Next high-prefill qualification profile.
# The environment is the exact realized 58-key environment captured by the
# five-context 2026-10-09 deterministic run. The receipt is configuration
# provenance only; it is not a throughput or quality claim.
recipe_version: "2"
model: Qwen3.8-Flash-Next-NVFP4-Offload
runtime: atlas
container: local
metadata:
  maintainer: flux-engine
  category: agent
  model_params: 35B
  quantization: nvfp4
  kv_dtype: bf16
  description: |
    Deterministic Flash-Next high-prefill qualification profile. It carries the exact
    measured effective environment, including the resident FP8 projection cache. Use the
    separately named native-MTP profile when speculative decode is required; the two memory
    contracts must not be combined.
defaults:
  port: 8888
  host: 127.0.0.1
  kernel_target: qwen3.8-flash-next
  gpu_memory_utilization: 0.85
  kv_cache_dtype: bf16
  max_model_len: 135168
  max_prefill_tokens: 16384
  max_batch_size: 1
  max_num_seqs: 1
  ssm_cache_slots: 0
  qwen4_qsa: true
  oom_guard_mb: 4096
  request_timeout: 0
atlas:
  model_type: qwen4_exp
  resident_gb: 103
  headroom_gb: 9
  run_alone: true
  environment_policy: sealed-v1
  profile_kind: flash-next-deterministic-prefill
  environment_sha256: 900beae6f1d5f00a1a5f8864b073f1a8dc0457abb08fe0819f3b0bc9fc6624ab
  forbidden_env:
    - ATLAS_QWEN4_PREFILL_FAST_PROJ_FP8_WEIGHT_CACHE_RESERVE_GB
    - ATLAS_DFLASH_BRANCH
    - ATLAS_DFLASH_BATCHED_VERIFY
    - ATLAS_DFLASH_DEEPLOOP
    - ATLAS_DDTREE_ENABLE
  env:
    ATLAS_CUBLAS_TUNED: "0"
    ATLAS_DFLASH_ASYNC: "0"
    ATLAS_PLE_CACHE_MB: "0"
    ATLAS_PLE_HALF_PAGE: "1"
