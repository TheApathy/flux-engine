# Built-in recipe: Qwen3.8-Flash-Next with its external native-MTP checkpoint
# and the bounded-copy reliability contract.  It is intentionally a separate
# card from the target-only and historical champion profiles.
recipe_version: "2"
model: Qwen3.8-Flash-Next-NVFP4-Offload
runtime: atlas
container: local
metadata:
  maintainer: atlas-radix
  category: agent
  model_params: 35B
  quantization: nvfp4
  kv_dtype: bf16
  description: |
    Qwen3.8-Flash-Next with /models/Qwen3.8-Flash-Next-Inferact-MTP,
    full-vocabulary K=5 native-MTP verify and the sealed cache-disabled candidate environment.
    The resident transformed-weight cache is disabled because it crossed the sealed
    watchdog margin after native MTP had engaged. Prefix caching and async DFlash are
    off, and every blocking host transfer uses bounded pinned staging. This named
    profile keeps the target-only cards unchanged. Its receipt proves configuration identity,
    not speculative engagement, quality, throughput, or endurance.
defaults:
  port: 8888
  host: 127.0.0.1
  kernel_target: qwen3.8-flash-next
  gpu_memory_utilization: 0.85
  kv_cache_dtype: bf16
  max_model_len: 135168
  max_prefill_tokens: 16384
  max_batch_size: 1
  max_num_seqs: 1
  ssm_cache_slots: 0
  qwen4_qsa: true
  oom_guard_mb: 4096
  request_timeout: 300
  enable_prefix_caching: false
  speculative: true
  mtp_from_path: /models/Qwen3.8-Flash-Next-Inferact-MTP
  num_drafts: 4
  mtp_vocab: 0
  mtp_quantization: bf16
atlas:
  model_type: qwen4_exp
  resident_gb: 100
  headroom_gb: 10
  run_alone: true
  environment_policy: sealed-v1
  profile_kind: flash-next-native-mtp-memory-safe
  environment_sha256: 281a35c55b3f792d973b9bc1e0c4ca1dd1c8bbfe87fcbd3552eaf7b5f6306755
  forbidden_env:
    - ATLAS_QWEN4_PREFILL_FAST_PROJ_FP8_WEIGHT_CACHE_RESERVE_GB
    - ATLAS_DFLASH_BRANCH
    - ATLAS_DFLASH_BATCHED_VERIFY
    - ATLAS_DFLASH_DEEPLOOP
    - ATLAS_DDTREE_ENABLE
  env:
    ATLAS_BOUNDED_HOST_COPY: "1"
    ATLAS_H2D_LEGACY_DRAIN: "0"
    ATLAS_DFLASH_ASYNC: "0"
    ATLAS_DFLASH_SPEC_CYCLE_V2: "1"
