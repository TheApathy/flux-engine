# typos (https://github.com/crate-ci/typos) config for Flux Engine.
#
# Ignore directories that mirror third-party upstream content, benchmark
# datasets, test vector dumps, or generated build outputs.

[default]
extend-ignore-re = [
    # Mixed hex commit SHAs / hashes containing both digits and a-f letters (e.g. `81afe8261`).
    '\b(?:[0-9]+[a-f]+[0-9a-f]*|[a-f]+[0-9]+[0-9a-f]*)\b',
    # OCP MXFP4/NVFP4 unsigned-exponent scale formats (`UE4M3`, `UE8M0`, `VEC16_UE4M3`, `ue8m0_to_f32`)
    # and MoE up-projection accumulator vars (`ue0`, `ue1`).
    '(?:UE|ue)[0-9][Mm][0-9]',
    '\bue[0-9]+\b',
    # Historical milestone tag `fnd4` in CUDA stream sync documentation.
    '\bfnd[0-9]+\b',
    # Standard hyphenated/underscored form `pre-empted` / `pre_empted`.
    '[Pp]re[-_]empted\b',
    # Creative Commons license identifier `CC BY-NC-ND`.
    'CC BY-NC-ND',
    # Regex fragments in log-scanner patterns (`allocat(?:or|ion)`, `fail(?:ed|ure)`).
    'allocat\(\?:or\|ion\)',
    'fail\(\?:ed\|ure\)',
    # Whitespace-stripped source-contract test assertions in Rust/Python tests.
    '\bifself\b',
    '\binself\b',
    'DFlashBRANCHinvalidtop-2row',
    'QWEN4_SERIAL_BATCH_FRAMErows',
    'ApplyPLEto',
    # Intentional negative-test literals verifying rejection of malformed keys/JSON/magic.
    'thinking\.defualt',
    'GGUF-not-reallY',
    'taget_layer_ids',
    '\{"a":tru\}',
    'convers\\\\u0061tion',
]
extend-ignore-identifiers-re = [
    # `in_proj_ba` is the bias projection in NVFP4 Mamba/SSM checkpoints.
    "in_proj_ba",
    # `iy_base`, `iy` etc. — CUDA kernel variable name for "index Y".
    "iy.*",
    # `BA_GEMM` — A+B linear-attention GEMM.
    "BA_GEMM",
]

[default.extend-words]
