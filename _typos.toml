intoto = "intoto"

[default.extend-identifiers]
wht_bf16 = "wht_bf16"
wht_dim = "wht_dim"
wht_stride = "wht_stride"

[files]
extend-exclude = [
    "test_data/",
    "target/",
    "target-*/",
    "tests/all_models_results*/",
    "repro-kit/llm-inference-bench/",
    "repro-kit/source-closure/",
    "repro-kit/fid_gate12/fid_gate12_manifest.jsonl",
    "kernels/gb10/qwen3.6-27b/nvfp4/q4k_vendor/",
    "kernels/gb10/deepseek-v4.1/cb3/cb3_decode_vectors.txt",
    "bench/llm-inference-bench/results/",
    "qualification/accuracy/reports/",
]
