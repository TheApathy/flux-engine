[model]
name = "glm5.3-flash"
hf_id = "zai-org/GLM-5.3-Flash"
params = "320B"
active_params = "18B"
architecture = "KDA + NoPE DSA + mHC + MoE + NextN"

layers_total = 45
layers_full_attention = 11
layers_linear_attention = 34

hidden_dim = 4096
head_dim = 256
q_heads = 64
kv_heads = 64
intermediate_size = 12288

vocab_size = 154880
max_position_embeddings = 1048576
rope_theta = 10000

num_experts = 288
num_experts_per_tok = 8
