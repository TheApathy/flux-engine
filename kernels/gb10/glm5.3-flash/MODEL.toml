# Drafter pairing profile (schema: crates/atlas-kernels/src/drafter_profile.rs).
# GLM-5.3 speculation is refused by the engine (target-only admission,
# serve_load). The row keeps GLM on the launcher's companion allow-list so
# discovery reports a GLM drafter instead of cross-matching a Qwen one.
[[dflash.profile]]
name = "glm-dflash2"
kind = "dflash2"
admission = "refused"
