[model]
name = "qwen3-next-80b-a3b"
hf_id = "nvidia/Qwen3-Next-80B-A3B-Instruct-NVFP4"
params = "80B"
active_params = "3B"
layers_attention = 12
layers_ssm = 36
moe_experts = 512
moe_topk = 10
hidden_dim = 2048
head_dim = 256
q_heads = 16
kv_heads = 2

# Qwen3-Next — older architecture, no official thinking mode.
[sampling.thinking_text]
temperature = 0.7
top_p = 0.95
top_k = 20
presence_penalty = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.95
top_k = 20
presence_penalty = 0.0

[[model_types]]
model_type = "qwen3_next"

# Model-specific behavior overrides. The engine default `max_thinking_budget`
# in `crates/atlas-kernels/build_parse.rs` is `262144` (effectively uncapped);
# this target sets `4096` below to cap extended reasoning length on
# Qwen3-Next-80B unless overridden per-request or via `--max-thinking-budget`.
[behavior]
# Content-loop watchdog disabled: 2026-05-05 chess-game stress
# sweep showed Qwen3-Next-80B (hybrid attention + GDN MoE A3B)
# finishes cleanly on long-code prompts. Only the dense Qwen 27B
# variants need the watchdog.
enable_loop_watchdog = false
# Qwen3-Next-80B supports `enable_thinking=true` via chat-template kwargs
# (matching the Qwen3 reasoning-tier chat template behavior). Thinking is
# enabled by default (`thinking_default = true`) and stays on when tools are
# active for multi-step tool reasoning; clients can opt out per-request or via
# `--disable-thinking`.
thinking_in_tools = true
# Cap default reasoning length below the engine's 262144 default. Per-request
# `thinking.budget_tokens` still wins below this; CLI `--max-thinking-budget`
# overrides this entirely.
max_thinking_budget = 4096
thinking_default = true
# Benchmarked 2026-04-11: K=2 (1 draft) is the sweet spot for the
# 80B-A3B MoE — verify overhead at K=3 wipes out acceptance gains.
default_num_drafts = 1

[kernel]
moe_gate_shmem_bytes = 4096   # hidden_dim(2048) * sizeof(bf16)
