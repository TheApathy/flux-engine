[model]
name = "qwen3.5-35b-a3b"
hf_id = "Sehyo/Qwen3.5-35B-A3B-NVFP4"
params = "35B"
active_params = "3B"
architecture = "Gated DeltaNet + Full Attention + MoE"

layers_total = 40
layers_linear_attention = 30
layers_full_attention = 10
layer_pattern = "3:1 (linear, linear, linear, full)"

moe_experts = 256
moe_topk = 8
moe_intermediate = 512
shared_expert_intermediate = 512

hidden_dim = 2048
head_dim = 256
q_heads = 16
kv_heads = 2

linear_attn_key_heads = 16
linear_attn_key_dim = 128
linear_attn_value_heads = 32
linear_attn_value_dim = 128
linear_conv_kernel = 4

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
partial_rotary_factor = 0.25
attn_output_gate = true

mtp_layers = 1
mtp_type = "full_attention"
vision = true

# Effective context for agentic tasks (tokens). Server-side compaction
# triggers when prompt exceeds 50% of this value. The 35B hybrid SSM
# (30 GDN + 10 attention layers) has ~16-24K effective context for tool
# calling despite 256K positional budget.
effective_context = 24576

# Recommended sampling defaults per category (from Qwen3.5 model card).
# Used when the client doesn't send explicit values.
# Categories: thinking_text, thinking_coding, non_thinking, tools
[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0

# Tool-calling preset. Sourced from the Qwen/Qwen3.5-35B-A3B HF model card
# (`temperature = 0.6`, `top_p = 0.95`, `top_k = 20` track Thinking/Coding for
# agentic coding sessions).
#
# Anti-repetition stack (LZ + DRY + moderated `presence_penalty = 0.6`):
# - On the A3B hybrid (30 GDN SSM + 10 full-attention), unmitigated agentic
#   sessions can fall into markdown-fence narration loops even at temperature > 0
#   (tracked upstream in QwenLM/Qwen3.5#115, Qwen3.6#88, qwen-code#1403,
#   vllm#27157).
# - We do NOT raise `repetition_penalty` above 1.0 (breaks legitimate code
#   identifier reuse per Qwen3-VL#1611) and keep `presence_penalty = 0.6` rather
#   than the model card's aggressive 1.5 ceiling, because 1.5 hurts long agentic
#   code/JSON responses by suppressing legitimate token reuse (arXiv:2512.04419).
# - LZ penalty (`lz_penalty = 0.2`, arXiv:2504.20131; 3/4/5-gram windows over
#   last 256 tokens) and DRY (`dry_allowed_length = 4`, catches >=5-token
#   narration loops while allowing short identifiers) handle phrase-loop
#   suppression without flat per-token penalties.
[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.6
frequency_penalty = 0.0
lz_penalty = 0.2
dry_multiplier = 0.8
dry_base = 1.75
dry_allowed_length = 4

# Model-specific behavior overrides. These control serving-layer workarounds
# that compensate for model-family quirks. Defaults are sane for most models;
# override here when a model family has known failure modes.
[behavior]
# Content-loop watchdog disabled: 2026-05-05 chess-game stress
# sweep showed this MoE A3B variant finishes cleanly on long-code
# prompts (no period-N repetition observed). The watchdog also
# false-positives on legitimate `[null × 8]` chess-board init rows.
# Only the dense Qwen 27B variants need it.
enable_loop_watchdog = false
# Thinking on by default for all Qwen reasoning-tier models (sweep 2026-05-20).
thinking_default = true
# Disable thinking when tools are active. Qwen3.5 suffers from "Think-Satisfy":
# model reasons about tool calls in <think>, convinces itself the task is done,
# then narrates instead of calling tools.
thinking_in_tools = false
# Maximum thinking budget (tokens). Prevents overthinking.
# Client-specified budget takes precedence if lower.
# Lowered 512 -> 256: extended single-turn thinking can trigger BPE state
# corruption and raw `<tool_call>` XML reaching the content channel after a
# budget-forced `</think>`. Halving the budget reduces exposure.
max_thinking_budget = 256
# Default num_drafts for speculative decoding (K = num_drafts + 1).
# Benchmarked 2026-04-10 on GB10: K=2 (1 draft) yields 117.8 tok/s vs
# K=3 (2 drafts) at 82.4 tok/s — 43% faster. The MoE verify overhead
# dominates any acceptance-rate gain at K=3 for this 35B-A3B model.
default_num_drafts = 1

[[model_types]]
model_type = "qwen3_5_moe"

[kernel]
moe_gate_shmem_bytes = 4096   # hidden_dim(2048) * sizeof(bf16)

# Drafter pairing profile (schema: crates/atlas-kernels/src/drafter_profile.rs).
# External DFlash v1 drafters are admitted by the generic validator; the row
# also puts this target on the launcher's companion-drafter allow-list.
[[dflash.profile]]
name = "generic-dflash"
kind = "dflash"
admission = "generic"
