# Numerics serve flags as launched; any flag not listed must stay at its default.
[cli]
"--kernel-target" = "qwen3.8-flash-next"

# Receipt-only in schema 1 (sampling.enforced = false).
[sampling.defaults]
temperature = 0.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0

[sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
presence_penalty = 0.0

[sampling.ranges]
temperature = [0.0, 2.0]
top_p = [0.0, 1.0]
top_k = [0, 1000]
presence_penalty = [-2.0, 2.0]

# Above 143359 the launcher adds ATLAS_CTX_OVERFLOW_TRUNCATE=0 and a larger
# FP8 cache reserve: a different, unqualified env set.
[limits]
max_seq_len = [2048, 143359]
max_prefill_tokens = [1, 16384]
max_batch_size = [1, 1]
qwen4_qsa = true

[speculation]
mode = "off"

[operational_env]
ATLAS_ALLOC_SEQ_ASYNC = { values = ["1"] }
ATLAS_BOUNDED_HOST_COPY = { values = ["1"] }
ATLAS_FAST_LOAD_DIRECT_IO_TENSOR_CAP = { values = ["20000"] }
ATLAS_MEMAVAILABLE_FLOOR_OVERRIDE = { values = ["1"] }
ATLAS_PLE_CACHE_MB = { values = ["0"] }
ATLAS_PLE_READ_AFFINITY = { values = ["big"] }
ATLAS_PLE_READ_RINGS = { values = ["4"] }
ATLAS_QWEN4_PLE_IO_QUEUE_DEPTH = { values = ["32", "256"] }
ATLAS_QWEN4_PLE_IO_TIMEOUT_MS = { values = ["30000"] }
ATLAS_QWEN4_PREFILL_FAST_PROJ_FP8_WEIGHT_CACHE = { values = ["0", "1"] }
ATLAS_QWEN4_PREFILL_FAST_PROJ_FP8_WEIGHT_CACHE_RESERVE_GB = { values = ["6"] }
ATLAS_QWEN4_QSA_VERIFY_STAGE_POOL_FUSED = { values = ["1"] }
ATLAS_QWEN4_RELEASE_BF16_QKVZ = { values = ["1"] }
ATLAS_QWEN4_RELEASE_SPEC_UNUSED = { values = ["1"] }
ATLAS_QWEN4_RELEASE_UNUSED = { values = ["1"] }
ATLAS_SCHED_BURST_GATHER_MS = { values = ["20"] }
