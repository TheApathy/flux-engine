# Recipe contract (schema 1): Qwen3.8-Flash-Next-NVFP4-QAD5500-Hybrid, C1 target-only accuracy harness.
# Use: flux-server serve --recipe repro-kit/recipes/qwen38-flash-next-qad5500-hybrid-c1-harness.toml (or FLUX_RECIPE).
# See docs/adr/recipe-contract.md.
#
# Target-only C1 accuracy-harness contract: FLUX_DISABLE_SPECULATION=1,
# ATLAS_QWEN4_PLE_SEGMENTED_GRAPHS=0, and the FP8 weight cache disabled.
# Names are classed by docs/env-inventory/env_inventory.csv; FLUX_ mirrors fold
# onto the ATLAS_ name the engine reads, and an ATLAS_ value wins.

