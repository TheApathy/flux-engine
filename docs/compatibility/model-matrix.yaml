# ==============================================================================
# Flux Engine — Complete Model Compatibility Matrix
# ==============================================================================
# Allowed Status Values:
#   mentioned | prototype | compiles | loads | correctness-passing |
#   benchmarked | release-qualified | regressed | retired
#
# Production Readiness Tiers (status_category):
#   verified_production | experimental_verified | supported_unverified | legacy
#
# Note on evidence_hash:
#   Entries with a bundled verification artifact or pinned binary digest carry
#   a `sha256:<hex>` digest. Entries whose historical sweep artifacts are not
#   bundled in this repository are honestly marked `"unverified"`.
# ==============================================================================

