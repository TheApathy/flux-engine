quantization_format_catalog:
  NVFP4:
    description: "NVIDIA 4-bit E2M1 weight payload with FP8 E4M3 micro-scales (group_size=16) and per-tensor FP32 global scale_2 (ModelOpt & compressed-tensors)."
    hardware_instruction: "mma.sync.aligned.m16n8k64.row.col.f32.e2m1.e2m1.f32.ue8m0 (sm_121a native block-scaled tensor core)"
  MXFP8:
    description: "OCP Microscaling FP8 E4M3 activation/weight format with E8M0 shared exponent per 32 elements (used in Qwen3.8-Flash-Next W4A8 MoE v28 kernels and ModelOpt mixed groups)."
    hardware_instruction: "mma.sync.aligned.m16n8k32.row.col.f32.e2m1.e4m3.f32.ue8m0"
  FP8-E4M3:
    description: "IEEE/OCP 8-bit floating point (E4M3) block-scaled or per-tensor scaled weights, activations (96-tensor resident fast-proj cache, QSA QK/PV core), and KV cache."
    hardware_instruction: "mma.sync.aligned.m16n8k32.row.col.f32.e4m3.e4m3.f32"
  INT4/AWQ:
    description: "4-bit integer / asymmetric weight-only quantization and MLX 8-bit/4-bit affine blocks (supported via W4A16 dequant-GEMV/GEMM and Metal MLX backend; AWQ tensor-name sniffed in weight_map)."
    hardware_instruction: "W4A16 LUT/LOP3 dequant + BF16 MMA / Metal simdgroup_matrix"
  BF16:
    description: "16-bit brain floating point for dense attention layers, mHC 4-stream residual highway, router gates, norms, embeddings, and reference checkpoints."
    hardware_instruction: "mma.sync.aligned.m16n8k16.row.col.f32.bf16.bf16.f32"
  CB3:
    description: "Custom 3-bit / 4-bit Codebook-3 + E8M0 MXFP4 routed-expert format for DeepSeek-V4.1 (K124/K154 resident expert pack, 71.7 GB)."
    hardware_instruction: "Fused CB3 grouped-GEMM MoE kernels on sm_121a"
  EXL3:
    description: "ExLlamaV3 trellis/codebook quantization (2.05 bpw) with runtime BF16/FP16 reconstruction for 320B GLM-5.3-Flash on single 128 GB GB10."
    hardware_instruction: "Fused EXL3 trellis reconstruct + cuBLASLt/WMMA GEMM"

speculative_decode_catalog:
  MTP:
    description: "Native Multi-Token Prediction draft head. Includes Qwen3.8-Flash-Next Inferact MTP K=5 (4 drafts + 1 target token, batched tree-WY GDN + unified-T MoE verify, LOSSLESS 10/10), Qwen3.5/3.6 MTP K=2, and MiniMax-M2.7 3-module sequential MTP K=3."
  DFlash:
    description: "Block-diffusion draft head (DFlash / DFlash2) capturing multi-layer target hidden states (ResidualSlice or Qwen4HyperProjected) with flat or DDTree/PCTree verification (gamma=3..8)."
  Eagle:
    description: "EAGLE-2 shallow-first cliff depth tree ordering and EAGLE-3.1 per-layer FC-normalization (ATLAS_DFLASH_FC_LAYERNORM=1) integrated into DFlash/speculative trait hierarchy."
  DSpark:
    description: "DeepSeek-V4.1 speculative drafter with strict two-probe adaptive-K (k=5 high-acceptance / k=2 low-acceptance) verification."

