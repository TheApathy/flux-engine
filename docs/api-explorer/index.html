<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flux Engine — Interactive API Explorer</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <style>
      body {
        margin: 0;
        background: #0d1117;
        color: #f0f6fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .flux-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
        font-size: 14px;
      }
      .flux-banner a {
        color: #38bdf8;
        text-decoration: none;
        margin-left: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="flux-banner">
      <strong>Flux Engine v1.0.3 — Interactive API Explorer</strong>
      <div>
        <a href="../">Docs Home</a>
        <a href="../api/">Rustdoc API</a>
        <a href="../openapi.json">openapi.json</a>
        <a href="https://github.com/TheApathy/flux-engine">GitHub</a>
      </div>
    </div>
    <script
      id="api-reference"
      data-url="../openapi.json"
      data-configuration='{"theme":"kepler","darkMode":true,"hideDownloadButton":false}'
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
