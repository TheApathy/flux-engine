    <text x="24" y="88" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="25" font-weight="800" fill="#34D399">SM121a · SM120a</text>
    <line x1="24" y1="112" x2="254" y2="112" stroke="#262c36" stroke-width="1.2"/>
    <text x="24" y="140" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">Custom NVFP4, MXFP8 &amp; W4A8</text>
    <text x="24" y="162" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">PTX / SASS kernels with formal</text>
    <text x="24" y="181" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#8B949E">zero-register-spill verification</text>

