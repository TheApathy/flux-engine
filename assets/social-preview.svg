    <text x="321" y="93" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="32" font-weight="800" fill="#38BDF8">6,381 tok/s</text>
    <text x="321" y="125" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#E6EDF3">16K cold prefill · 128 GB UMA</text>
