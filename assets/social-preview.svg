    <rect x="297" y="0" width="278" height="194" rx="16" fill="#161b22" stroke="#38BDF8" stroke-width="1.8"/>
    <circle cx="321" cy="30" r="6" fill="#38BDF8"/>
    <text x="337" y="35" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#9CA3AF">ZERO-OVERHEAD CORE</text>
    <text x="321" y="88" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="27" font-weight="800" fill="#38BDF8">Pure Rust</text>
    <line x1="321" y1="112" x2="551" y2="112" stroke="#262c36" stroke-width="1.2"/>
    <text x="321" y="140" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">Single native binary with zero</text>
    <text x="321" y="162" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">Python runtime, CUDA graphs,</text>
    <text x="321" y="181" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#8B949E">multi-GPU KV &amp; Metal support</text>

    <!-- Card 3: Speculative & Long Context -->
    <rect x="594" y="0" width="278" height="194" rx="16" fill="#161b22" stroke="#A855F7" stroke-width="1.8"/>
    <circle cx="618" cy="30" r="6" fill="#A855F7"/>
    <text x="634" y="35" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#9CA3AF">DECODE &amp; CONTEXT</text>
    <text x="618" y="88" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="27" font-weight="800" fill="#C084FC">DFlash2 · MTP</text>
    <line x1="618" y1="112" x2="848" y2="112" stroke="#262c36" stroke-width="1.2"/>
    <text x="618" y="140" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">Lossless batched speculation,</text>
    <text x="618" y="162" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">TurboQuant+ KV compression,</text>
    <text x="618" y="181" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#8B949E">and ultra-long YaRN context</text>

    <!-- Card 4: Drop-In APIs & Supply Chain -->
    <rect x="891" y="0" width="278" height="194" rx="16" fill="#161b22" stroke="#F59E0B" stroke-width="1.8"/>
    <circle cx="915" cy="30" r="6" fill="#F59E0B"/>
    <text x="931" y="35" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#9CA3AF">DROP-IN &amp; VERIFIED</text>
    <text x="915" y="88" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="25" font-weight="800" fill="#FBBF24">OpenAI · Claude</text>
    <line x1="915" y1="112" x2="1145" y2="112" stroke="#262c36" stroke-width="1.2"/>
    <text x="915" y="140" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">OpenAI, Anthropic &amp; Ollama</text>
    <text x="915" y="162" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#D1D5DB">endpoints, tool calling, xgrammar,</text>
    <text x="915" y="181" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="14" fill="#8B949E">Cosign &amp; SLSA L3 provenance</text>
