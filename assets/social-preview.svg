    <text x="321" y="168" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.8" fill="#8B949E">91.3 peak decode · 298.8 C=16</text>
    <text x="321" y="187" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.8" fill="#8B949E">5,906 @ 128K · 0-ULP exact</text>

