    <rect x="594" y="0" width="278" height="200" rx="16" fill="#161b22" stroke="#A855F7" stroke-width="1.8"/>
    <circle cx="618" cy="30" r="6" fill="#A855F7"/>
    <text x="634" y="35" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#9CA3AF">SM120 · QWEN3.8-27B</text>
    <text x="618" y="93" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="32" font-weight="800" fill="#C084FC">1,975 tok/s</text>
    <text x="618" y="125" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#E6EDF3">C=64 · 97.3% GDDR7 roofline</text>
    <line x1="618" y1="144" x2="848" y2="144" stroke="#262c36" stroke-width="1.2"/>
    <text x="618" y="168" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.8" fill="#8B949E">1,074 C=8 hoisted DFlash2</text>
    <text x="618" y="187" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.8" fill="#8B949E">16.2K 8K prefill · 438 C=1</text>

    <!-- Card 4: 1M Context & Pooled KV -->
    <rect x="891" y="0" width="278" height="200" rx="16" fill="#161b22" stroke="#F59E0B" stroke-width="1.8"/>
    <circle cx="915" cy="30" r="6" fill="#F59E0B"/>
    <text x="931" y="35" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#9CA3AF">1M YARN4 · POOLED KV</text>
    <text x="915" y="93" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="32" font-weight="800" fill="#FBBF24">1,011K tok</text>
    <text x="915" y="125" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#E6EDF3">3/3 passkey PASS on 1× 96 GB</text>
    <line x1="915" y1="144" x2="1145" y2="144" stroke="#262c36" stroke-width="1.2"/>
    <text x="915" y="168" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.8" fill="#8B949E">12.3K tok/s TTFT · 82.1 s</text>
    <text x="915" y="187" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.8" fill="#8B949E">Up to 16.8M KV across 8× GPUs</text>
  </g>

  <!-- Bottom Footer Strip -->
  <text x="56" y="586" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#8B949E">OpenAI · Anthropic · Ollama APIs  ·  21/21 PTX+SASS ISA Proved  ·  Cosign + SLSA Level 3</text>
  <text x="1224" y="586" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="end">github.com/TheApathy/flux-engine</text>
</svg>
