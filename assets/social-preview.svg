  <g transform="translate(308, 62)">
    <!-- Status Pills Row -->
    <rect x="0" y="0" width="174" height="32" rx="16" fill="#122d1f" stroke="#10B981" stroke-width="1.5"/>
    <text x="87" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#34D399" text-anchor="middle">v1.0.3 · RELEASE</text>

    <rect x="188" y="0" width="204" height="32" rx="16" fill="#111d2e" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="290" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#38BDF8" text-anchor="middle">0 REGISTER SPILLS</text>

    <rect x="406" y="0" width="194" height="32" rx="16" fill="#211433" stroke="#A855F7" stroke-width="1.5"/>
    <text x="503" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#C084FC" text-anchor="middle">SLSA L3 · SIGNED</text>

    <rect x="614" y="0" width="166" height="32" rx="16" fill="#271c0c" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="697" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#FBBF24" text-anchor="middle">AGPL-3.0-only</text>

    <!-- Main Wordmark -->
    <text x="0" y="106" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="60" font-weight="800" fill="#F0F6FC" letter-spacing="1.5">FLUX ENGINE</text>

    <!-- Technical Subtitle -->
    <text x="0" y="148" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18.5" font-weight="700" fill="#38BDF8" letter-spacing="0.8">PURE RUST + BLACKWELL CUDA/PTX LLM INFERENCE RUNTIME</text>

    <!-- Tagline -->
    <text x="0" y="182" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="18.5" font-weight="400" fill="#9CA3AF">Hardware-specific NVFP4 / MXFP8 / W4A8 kernels &amp; DFlash2 speculation</text>
    <text x="0" y="209" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="18.5" font-weight="400" fill="#9CA3AF">for NVIDIA DGX Spark (GB10) and Discrete Blackwell (RTX PRO 6000 SM120)</text>
  </g>

