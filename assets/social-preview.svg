    <rect x="0" y="0" width="150" height="32" rx="16" fill="#122d1f" stroke="#10B981" stroke-width="1.5"/>
    <text x="75" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#34D399" text-anchor="middle">PURE RUST</text>

