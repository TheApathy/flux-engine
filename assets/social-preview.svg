    <circle cx="24" cy="30" r="6" fill="#10B981"/>
    <text x="40" y="35" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#9CA3AF">SM120 · FLASH-NEXT</text>
    <text x="24" y="93" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="32" font-weight="800" fill="#34D399">661 tok/s</text>
    <text x="24" y="125" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#E6EDF3">C=1 DFlash2 · 11.66 ms/rnd</text>
    <line x1="24" y1="144" x2="254" y2="144" stroke="#262c36" stroke-width="1.2"/>
