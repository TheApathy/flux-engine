      <stop offset="55%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="0.9" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Full Bleed Background -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#topGlow)"/>

  <!-- Inner Frame (Safe Margin 24px) -->
  <rect x="24" y="24" width="1232" height="592" rx="22" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M 48 25 H 1232" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Emblem Card (x=56..276, y=62..294) -->
  <g transform="translate(56, 62)">
    <rect x="0" y="0" width="220" height="232" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <polygon points="110,22 176,60 176,132 110,170 44,132 44,60" fill="url(#coreGrad)" stroke="#38BDF8" stroke-width="2.6" stroke-linejoin="round"/>
    <polygon points="110,40 160,69 160,123 110,152 60,123 60,69" fill="none" stroke="#FBBF24" stroke-width="2.3" stroke-dasharray="6 3.5"/>
    <line x1="44" y1="60" x2="110" y2="96" stroke="#F59E0B" stroke-width="2.1" stroke-dasharray="5 3.5" opacity="0.85"/>
    <line x1="176" y1="60" x2="110" y2="96" stroke="#F59E0B" stroke-width="2.1" stroke-dasharray="5 3.5" opacity="0.85"/>
    <line x1="110" y1="96" x2="110" y2="170" stroke="#FBBF24" stroke-width="2.1" stroke-dasharray="5 3.5" opacity="0.85"/>
    <polygon points="110,35 116,45 104,45" fill="#FBBF24"/>
    <polygon points="163,125 153,127 158,117" fill="#FBBF24"/>
    <polygon points="57,125 62,117 67,127" fill="#FBBF24"/>
    <path d="M 88 62 H 136 L 110 92 H 134 L 86 134 L 99 98 H 80 Z" fill="url(#goldBoltGrad)" stroke="#FEF08A" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="20" y="186" width="180" height="30" rx="15" fill="#0d1117" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="110" y="206" font-family="'DejaVu Sans Mono', 'JetBrains Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#FBBF24" text-anchor="middle">SM121a · SM120a</text>
  </g>

