    <text x="270" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#38BDF8" text-anchor="middle">CUDA / PTX KERNELS</text>

    <rect x="390" y="0" width="194" height="32" rx="16" fill="#211433" stroke="#A855F7" stroke-width="1.5"/>
    <text x="487" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#C084FC" text-anchor="middle">SLSA L3 · SIGNED</text>

    <rect x="598" y="0" width="166" height="32" rx="16" fill="#271c0c" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="681" y="21" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#FBBF24" text-anchor="middle">AGPL-3.0-only</text>

    <!-- Main Wordmark -->
    <text x="0" y="108" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="62" font-weight="800" fill="#F0F6FC" letter-spacing="1.5">FLUX ENGINE</text>

    <!-- Technical Subtitle -->
    <text x="0" y="150" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="18.5" font-weight="700" fill="#38BDF8" letter-spacing="0.8">BLACKWELL-NATIVE RUST + CUDA LLM INFERENCE RUNTIME</text>

    <!-- Tagline -->
    <text x="0" y="184" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="19" font-weight="400" fill="#9CA3AF">Hardware-specific NVFP4, MXFP8 &amp; W4A8 kernels with speculative decoding</text>
    <text x="0" y="212" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="19" font-weight="400" fill="#9CA3AF">for NVIDIA DGX Spark (GB10) and Discrete Blackwell (RTX PRO 6000 SM120)</text>
  </g>

