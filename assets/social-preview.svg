  <!-- Bottom Footer Strip -->
  <text x="56" y="586" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#8B949E">AGPL-3.0-only  ·  Signed Releases &amp; GHCR Images  ·  Deterministic SPDX SBOM</text>
  <text x="1224" y="586" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14.5" font-weight="700" fill="#E6EDF3" text-anchor="end">github.com/TheApathy/flux-engine</text>
