# SPDX-License-Identifier: AGPL-3.0-only
# Reference Kubernetes Deployment + ClusterIP Service for Flux Engine (SM120).
# Pin the image to an immutable digest (`@sha256:...`) verified via
# `./scripts/verify_release.sh --image ...` before deploying to production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-engine
  labels:
    app.kubernetes.io/name: flux-engine
    app.kubernetes.io/version: "1.0.3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flux-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8899"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flux-engine
          image: ghcr.io/theapathy/flux-engine:v1.0.3-sm120
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8899
              protocol: TCP
          env:
            - name: FLUX_HOST
              value: "0.0.0.0"
            - name: FLUX_PORT
              value: "8899"
            - name: FLUX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flux-engine-auth
                  key: api-key
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "96Gi"
            requests:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "32Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: flux-models-pvc
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flux-engine
  labels:
    app.kubernetes.io/name: flux-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flux-engine
  ports:
    - name: http
      port: 8899
      targetPort: http
